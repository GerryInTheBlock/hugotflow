# Render Blueprint for the recommendation service (free web service; sleeps after 15 min idle).
# In Render: New > Blueprint > pick the GitHub repo. Then set the two secret values in the service's Environment tab.
services:
  - type: web
    name: hugotflow-recommender
    runtime: python
    plan: free
    rootDir: services/recommender
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
